- name: Nginx webserver
  hosts: my_web_server
  become: true
  vars_files:
    - ./config.json

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: "nginx={{ nginx_version }}"
        state: present
     
    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Copy Nginx configuration file
      ansible.builtin.copy:
        src: /home/ephra/webserver-automation/web/webserver.html
        dest: /var/www/html/index.nginx-debian.html
      


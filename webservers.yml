- name: Nginx webserver
  hosts: my_web_server
  become: true
  vars_files:
    - ./config.json

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: "nginx={{ nginx_version }}"
        state: present
     
    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Creating a user
      ansible.builtin.user:
        name: webuser
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Copy html file to webserver
      ansible.builtin.copy:
        src: ./web/webserver.html
        dest: /var/www/html/index.html
        owner: webuser
        group: webuser
        mode: '0644'
      

